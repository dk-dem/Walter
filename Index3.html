<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gachi Clicker — Boss of the Gym</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
    }
    .game-box {
      max-width: 440px;
      width: 100%;
      background: #1e293b;
      padding: 32px;
      border-radius: 24px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .score-display {
      font-size: 42px;
      font-weight: 800;
      color: #f8fafc;
      margin: 8px 0;
    }
    .rank-display {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .clicker-area {
      position: relative;
      display: inline-block;
      margin: 10px 0 24px;
    }
    .billy-img {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease;
      background: #0f172a;
    }
    .billy-img:hover {
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.6);
    }
    .billy-img:active {
      transform: scale(0.92);
    }
    .upgrades {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #0284c7;
      color: #ffffff;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .reset-btn {
      margin-top: 8px;
      background: transparent;
      color: #64748b;
      font-size: 12px;
      padding: 6px;
    }
    .reset-btn:hover:not(:disabled) {
      background: transparent;
      color: #ef4444;
    }
    .floating-text {
      position: absolute;
      font-weight: 800;
      font-size: 18px;
      color: #38bdf8;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-65px) scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="badge">♂️ Boss of the Gym Clicker</div>
    <div class="score-display" id="score">0 ♂️</div>
    <div class="rank-display" id="rank">Ранг: Jabroni</div>

    <div class="clicker-area" id="clicker-area">
      <!-- Файл billy.gif должен лежать в той же папке, что и этот HTML-файл -->
      <img
        src="billy.gif"
        alt="Billy Herrington"
        class="billy-img"
        id="billy-btn"
        draggable="false"
      >
    </div>

    <div class="upgrades">
      <button id="upgrade-click" onclick="buyClickUpgrade()">
        Усилить шлепок (+1 за клик) — 15 ♂️
      </button>
      <button id="upgrade-auto" onclick="buyAutoUpgrade()">
        Нанять Dungeon Master (+1 в сек) — 50 ♂️
      </button>
      <button class="reset-btn" onclick="resetProgress()">
        Сбросить прогресс
      </button>
    </div>
  </div>

  <script>
    // Загружаем сохранённый прогресс из localStorage (или ставим значения по умолчанию)
    let score = Number(localStorage.getItem('gachi_score')) || 0;
    let clickPower = Number(localStorage.getItem('gachi_clickPower')) || 1;
    let autoPower = Number(localStorage.getItem('gachi_autoPower')) || 0;
    let clickCost = Number(localStorage.getItem('gachi_clickCost')) || 15;
    let autoCost = Number(localStorage.getItem('gachi_autoCost')) || 50;

    const phrases = ['+1 ♂️', 'ASS WE CAN!', '♂️ SLAP! ♂️', 'YES SIR!', 'WOO!', '300 BUCKS!'];

    const billyBtn = document.getElementById('billy-btn');
    const clickerArea = document.getElementById('clicker-area');

    // Функция сохранения всех данных в память браузера
    function saveGame() {
      localStorage.setItem('gachi_score', score);
      localStorage.setItem('gachi_clickPower', clickPower);
      localStorage.setItem('gachi_autoPower', autoPower);
      localStorage.setItem('gachi_clickCost', clickCost);
      localStorage.setItem('gachi_autoCost', autoCost);
    }

    // Функция сброса прогресса
    function resetProgress() {
      if (confirm('Точно сбросить весь прогресс?')) {
        localStorage.removeItem('gachi_score');
        localStorage.removeItem('gachi_clickPower');
        localStorage.removeItem('gachi_autoPower');
        localStorage.removeItem('gachi_clickCost');
        localStorage.removeItem('gachi_autoCost');

        score = 0;
        clickPower = 1;
        autoPower = 0;
        clickCost = 15;
        autoCost = 50;
        updateUI();
      }
    }

    billyBtn.addEventListener('click', function (e) {
      score += clickPower;
      spawnFloatingText(e);
      updateUI();
      saveGame();
    });

    function spawnFloatingText(e) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
      el.innerText = clickPower > 1 ? '+' + clickPower + ' ♂️' : randomPhrase;

      const rect = clickerArea.getBoundingClientRect();
      const x = e.clientX - rect.left - 25;
      const y = e.clientY - rect.top - 15;

      el.style.left = x + 'px';
      el.style.top = y + 'px';
      clickerArea.appendChild(el);

      setTimeout(() => el.remove(), 700);
    }

    function buyClickUpgrade() {
      if (score >= clickCost) {
        score -= clickCost;
        clickPower += 1;
        clickCost = Math.floor(clickCost * 1.6);
        updateUI();
        saveGame();
      }
    }

    function buyAutoUpgrade() {
      if (score >= autoCost) {
        score -= autoCost;
        autoPower += 1;
        autoCost = Math.floor(autoCost * 1.7);
        updateUI();
        saveGame();
      }
    }

    function getRank() {
      if (score >= 1000) return 'Ранг: ♂️ Boss of This Gym ♂️';
      if (score >= 300) return 'Ранг: Dungeon Master (300$)';
      if (score >= 100) return 'Ранг: Performance Artist';
      if (score >= 30) return 'Ранг: Boy Next Door';
      return 'Ранг: Jabroni';
    }

    function updateUI() {
      document.getElementById('score').innerText = score + ' ♂️';
      document.getElementById('rank').innerText = getRank();

      const clickBtn = document.getElementById('upgrade-click');
      clickBtn.innerText = 'Усилить шлепок (+1 за клик) — ' + clickCost + ' ♂️';
      clickBtn.disabled = score < clickCost;

      const autoBtn = document.getElementById('upgrade-auto');
      autoBtn.innerText = 'Нанять Dungeon Master (+1 в сек) — ' + autoCost + ' ♂️';
      autoBtn.disabled = score < autoCost;
    }

    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateUI();
        saveGame();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
